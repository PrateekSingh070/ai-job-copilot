# Local development database: PostgreSQL 16 with the pgvector extension
# preinstalled (required for the RAG chat's embedding column).
#
#   docker compose up -d
#
# Matches the default DATABASE_URL in .env.example.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
